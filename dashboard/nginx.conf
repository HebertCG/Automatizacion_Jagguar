# ============================================================
# Jaguar Carwash — nginx para servir el dashboard estático
# Incluye cabeceras de seguridad, rate limiting y compresión.
# ============================================================

# Rate limit básico de borde (mitiga scraping/DoS al sitio estático).
# El límite REAL de envío de WhatsApp vive en la Edge Function.
limit_req_zone $binary_remote_addr zone=jaguar:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx
    server_tokens off;

    # --- Compresión ------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # --- Cabeceras de seguridad -------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # HSTS: fuerza HTTPS. Inofensivo si llega por HTTP plano (el navegador lo
    # ignora). Coolify/Traefik termina el TLS; esto es defensa en profundidad.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP: solo permite el SDK de Supabase (jsdelivr), Google Fonts y
    # conexiones a Supabase (REST + Realtime por WebSocket). frame-ancestors
    # 'none' complementa X-Frame-Options contra clickjacking.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Rutas ------------------------------------------------
    location / {
        limit_req zone=jaguar burst=40 nodelay;
        try_files $uri $uri/ =404;
    }

    # JS/CSS SIN hash en el nombre: revalidar siempre (expires -1 → Cache-Control:
    # no-cache) para no servir código viejo tras un deploy. `expires` no pisa los
    # add_header de seguridad heredados (a diferencia de un add_header anidado).
    location ~* \.(?:css|js)$ {
        expires -1;
        try_files $uri =404;
    }

    # Imágenes/fuentes: caché larga (mismo nombre = mismo contenido).
    location ~* \.(?:svg|png|jpg|jpeg|webp|avif|woff2|ico)$ {
        expires 30d;
        try_files $uri =404;
    }

    # Endpoint de salud para el healthcheck de Docker
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
