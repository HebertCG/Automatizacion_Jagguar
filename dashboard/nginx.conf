# ============================================================
# Jaguar Carwash — nginx para servir el dashboard estático
# Incluye cabeceras de seguridad y compresión.
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la versión de nginx
    server_tokens off;

    # --- Compresión ------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # --- Cabeceras de seguridad -------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: solo permite el SDK de Supabase (jsdelivr), Google Fonts
    # y conexiones a Supabase (REST + Realtime por WebSocket).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://cdn.jsdelivr.net https://*.supabase.co wss://*.supabase.co; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Rutas ------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache moderada para estáticos (expires no pisa los add_header)
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Endpoint de salud para el healthcheck de Docker
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
